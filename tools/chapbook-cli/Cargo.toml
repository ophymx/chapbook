[package]
name = "chapbook-cli"
description = "Development CLI exercising each stage of the chapbook pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "chapbook_cli"
path = "src/lib.rs"

[[bin]]
name = "chapbook"
path = "src/main.rs"

[features]
# The framebuffer example. Off by default because it is the one thing here
# that needs a device: `mezzotint/fbdev` is Linux-only, and a dev CLI on a
# desktop has no framebuffer to open.
fbdev = ["mezzotint/fbdev"]

[dependencies]
chapbook-core = { workspace = true }
chapbook-epub = { workspace = true }
# The binary uses only `open_publication` — the byte-sniffing open every
# format-agnostic caller shares — and still works a stage at a time with
# no session. The `show` example drives a whole session onto a panel.
chapbook-reader = { workspace = true, features = ["cbz", "pdf", "svg", "mathml"] }
image = { workspace = true }
chapbook-layout = { workspace = true, features = ["svg", "mathml"] }
chapbook-paint = { workspace = true }
chapbook-render-tinyskia = { workspace = true }
# The dev CLI is a desktop process: it wants the bundled transport.
chapbook-opds = { workspace = true, features = ["ureq"] }
chapbook-library = { workspace = true }
# `lib sync` drives the reconcile loop; ureq for the same reason as above.
chapbook-sync = { workspace = true, features = ["ureq"] }
mezzotint = { workspace = true }
clap = { workspace = true }
cosmic-text = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

# The chapbook half of the panel seam: mezzotint's own examples cover a
# panel with no book behind it, and this one covers the pairing.
[[example]]
name = "show"
required-features = ["fbdev"]
