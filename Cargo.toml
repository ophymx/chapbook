[workspace]
resolver = "2"
members = [
    "crates/chapbook-core",
    "crates/chapbook-epub",
    "crates/chapbook-layout",
    "crates/chapbook-paint",
    "crates/chapbook-render-tinyskia",
    "crates/chapbook-render-vello",
    "crates/chapbook-opds",
    "crates/opds-client",
    "crates/chapbook-cbz",
    "crates/chapbook-pdf",
    "crates/chapbook-library",
    "crates/chapbook-annotations",
    "crates/chapbook-sync",
    "crates/chapbook-reader",
    "crates/chapbook-ffi",
    "crates/chapbook-jni",
    "crates/chapbook-viewer",
    "crates/chapbook-viewer-gtk",
    "crates/chapbook-viewer-win32",
    "crates/chapbook-app",
    "crates/chapbook-app-gtk",
    "tools/chapbook-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92" # floor: hayro (stylo needs 1.89)
license = "MIT OR Apache-2.0"
authors = ["Jeffrey T. Peckham <abic@ophymx.com>"]
repository = "https://github.com/ophymx/chapbook"
readme = "README.md"

[workspace.dependencies]
# Internal crates
chapbook-core = { path = "crates/chapbook-core" }
chapbook-epub = { path = "crates/chapbook-epub" }
# `default-features = false` for the same reason as chapbook-opds below:
# without it here, chapbook-reader's own `default-features = false` (which
# makes its `svg`/`mathml` passthroughs real choices) is silently ignored.
# Members that want the defaults name them (chapbook-cli does).
chapbook-layout = { path = "crates/chapbook-layout", default-features = false }
chapbook-paint = { path = "crates/chapbook-paint" }
chapbook-render-tinyskia = { path = "crates/chapbook-render-tinyskia" }
chapbook-render-vello = { path = "crates/chapbook-render-vello" }
# `default-features = false` here so a member can drop the bundled ureq
# transport: without it on the workspace entry, a member's own
# `default-features = false` is silently ignored. Members that want the
# desktop transport enable `chapbook-opds/ureq` through a feature of
# their own.
chapbook-opds = { path = "crates/chapbook-opds", default-features = false }
# Not chapbook-prefixed on purpose: no chapbook dependency, and headed for
# its own repo. chapbook-opds is the thin binding that keeps it here.
# Defaults off for the same reason chapbook-reader's are: the bundled ureq
# transport is a choice a build should have to make, and a device build that
# routes HTTP through the host must be able to not make it.
opds-client = { path = "crates/opds-client", default-features = false }
chapbook-cbz = { path = "crates/chapbook-cbz" }
chapbook-pdf = { path = "crates/chapbook-pdf" }
chapbook-library = { path = "crates/chapbook-library" }
chapbook-annotations = { path = "crates/chapbook-annotations", default-features = false }
chapbook-sync = { path = "crates/chapbook-sync", default-features = false }
# No defaults here: each shell names the formats it means to open, so a
# device build's surface is visible in its own manifest rather than
# inherited. External consumers get the full default set as usual.
chapbook-reader = { path = "crates/chapbook-reader", default-features = false }
chapbook-ffi = { path = "crates/chapbook-ffi", default-features = false }
# Defaults off, like chapbook-reader: the C ABI and the JNI binding name
# the profile their platform wants, and `desktop` is the one profile no
# phone may inherit by accident. The GTK app asks for the defaults itself.
chapbook-app = { path = "crates/chapbook-app", default-features = false }

# The panel seam: update classes, the driver that holds the refresh rules,
# and the backends underneath. It was chapbook's own module until it turned
# out to have nothing to do with books, so it is somebody else's crate now
# and chapbook is an ordinary consumer.
#
# Defaults off because they include `fbdev`, and which backend a build talks
# to is a shell's decision — chapbook-core wants the vocabulary and nothing
# else. A shell that means to open /dev/fb0 asks for `mezzotint/fbdev`
# itself; `std` is here because every consumer in this workspace has one.
mezzotint = { version = "0.1", default-features = false, features = ["std"] }

# Stylo lockstep set — these release together and break together; pin exact
# versions and upgrade all of them in one deliberate pass (use Blitz's diff
# as the migration guide).
style = { version = "=0.20.0", package = "stylo" }
style_traits = { version = "=0.20.0", package = "stylo_traits" }
style_atoms = { version = "=0.20.0", package = "stylo_atoms" }
style_config = { version = "=0.20.0", package = "stylo_static_prefs" }
style_dom = { version = "=0.20.0", package = "stylo_dom" }
selectors = "=0.40.0"
cssparser = "=0.37.0"
# Version-locked to what stylo 0.20 itself uses (types appear in its API)
euclid = "0.22"
app_units = "0.7"
html5ever = "0.39"
markup5ever = "0.39"
xml5ever = "0.39"

# Text shaping/layout and CPU rasterization
# `fontconfig` is one of its defaults and is turned back on per target by
# chapbook-layout, which is the crate that builds the font system. It reads
# `/etc/fonts/fonts.conf` to correct the five CSS generics, which is real
# work on a Linux desktop and impossible anywhere the file cannot exist.
# fontdb already excludes it on Android and macOS; iOS is the one that
# slipped through, being unix and neither, so it took the Linux branch and
# carried a config parser it could never read a config with.
cosmic-text = { version = "0.19", default-features = false, features = [
    "std",
    "swash",
] }
# Both are cosmic-text's own dependencies, named here because chapbook-layout
# builds the font system itself rather than calling `FontSystem::new()`:
# `unicode-script` is the script type its `Fallback` trait speaks, so the
# version must match cosmic-text's, and `sys-locale` is how it resolves the
# host locale.
unicode-script = "0.5"
# UAX #29 word boundaries for the text surface (TTS word timing,
# dictionary word-at-tap). Already in the tree via cosmic-text.
unicode-segmentation = "1.12"
sys-locale = "0.3"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
tiny-skia = "0.12"
# GPU backend. A second rasterizer over the same display list, to keep the
# paint seam honest — vello maps glyph runs onto pre-shaped glyphs directly,
# so nothing is re-shaped on the way to the GPU.
vello = "0.10"
pollster = "0.4"
# Decode only, and only the formats EPUB 3 and comic archives actually
# carry. `rayon` is deliberately absent: image gates only its opt-in
# parallel ImageBuffer iterators and the avif/exr *encoders* on it, none of
# which we use, so it bought a thread pool and nothing else.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# SVG rasterization (CPU, over the tiny-skia already in the graph). `text`
# because book diagrams carry labels — usvg gets a fontdb copied from the
# session's own FontSystem, never the host's, so goldens stay deterministic;
# `raster-images` because EPUB cover SVGs wrap a JPEG `<image>`. No
# `system-fonts`: font policy belongs to `FontSource`, nothing else.
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "raster-images",
] }
# usvg's fontdb (0.24 — a second build beside cosmic-text's 0.23), named
# only to enable `fs`: file-backed session faces then load into usvg by
# path (metadata parse, bytes read on demand) instead of by bulk copy.
# The types still come via `resvg::usvg::fontdb`; resvg's own feature for
# this is `system-fonts`, which also drags in fontconfig policy we refuse.
fontdb = { version = "0.24", default-features = false, features = [
    "std",
    "fs",
] }
# MathML Core layout: OpenType MATH metrics in, glyphs-and-rules out. Its
# `svg` feature is a debugging emitter we have no use for. 0.2 carries
# glyph advances in the display list and probes MATH tables itself, so no
# font parser rides along anymore.
formulary = { version = "0.2", default-features = false, features = [
    "shaping",
] }

# EPUB. We only ever read: `write` is rbook's EPUB *authoring* half.
rbook = { version = "0.7", default-features = false, features = [
    "threadsafe",
    "prelude",
] }
# CBZ (deflate + stored cover the comic archives in the wild). Note
# `deflate-flate2-zlib-rs` and not the `deflate` umbrella: that one also
# turns on zopfli, a compressor, which a reader has no use for.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
# PDF rasterization (pure Rust, CPU-only)
hayro = "0.7"
sha1 = "0.10" # IDPF font de-obfuscation key derivation

# OPDS. NOTE: not atom_syndication/feed-rs — both silently drop the
# foreign-namespace <link> attributes (opds:*, thr:count, pse:*) that facets
# and page streaming live in. See crates/opds-client/INTEROP.md §0.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Library persistence
rusqlite = { version = "0.40", features = ["bundled"] }

# Viewer
winit = "0.30"
# The GTK shell's cross-thread wakeup. Both arrive in the graph under glib
# regardless — naming them here adds no crate, it only lets the shell say
# what it is using. Default features off: the executor, the io-compat
# layer and the thread pool are all things glib's main context already is.
futures-channel = { version = "0.3", default-features = false, features = [
    "std",
] }
futures-util = { version = "0.3", default-features = false, features = [
    "std",
] }
softbuffer = "0.4"
# Clipboard for the winit shell (GTK has gdk's). Text only — the image-data
# default feature would pull a second `image` build; wayland-data-control
# covers Wayland alongside X11.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }
# The Win32 shell's whole platform surface. Already in the graph at this
# version under wgpu-hal, which the vello backend pulls, so naming it here
# adds no crate and no licence decision — it only lets one more member ask
# for features of it. `windows` rather than `windows-sys`: the COM half is
# what a UI Automation text provider needs, and that is where this shell is
# going.
# The `#[implement]` macro spells its own paths `windows_core::…`, so the
# crate has to be nameable — `windows::core` is a re-export of exactly this
# crate at exactly this version, so naming it costs nothing in the graph and
# is what lets a COM interface be implemented in Rust at all.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # Ole and Variant are not a widening for their own sake: the
    # `IRawElementProviderSimple` and `ITextRangeProvider` vtables are
    # `cfg`-gated on all three, because their methods traffic in `VARIANT`
    # and `SAFEARRAY`. `CF_UNICODETEXT` arrives with them.
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Misc
libc = "0.2"
slotmap = "1"
thiserror = "2"
# Diagnostics. Already in the graph via cosmic-text and fontdb, so the
# engine gaining a voice costs no new dependency — and every host has a
# backend already: android_logger, oslog, console_log, env_logger.
log = "0.4"
clap = { version = "4", features = ["derive"] }

# Dev
insta = { version = "1", features = ["glob"] }
proptest = "1"

[profile.dev]
# stylo is slow in unoptimized builds; keep debug-friendly but usable
opt-level = 1
# Line tables, not the full DWARF. Measured on chapbook-viewer: the debug
# binary was 739 MB, of which 682 MB was debug info, and it is written to
# disk again on every relink. With this and the dependency override below
# it is 73 MB with 19 MB of debug info — a tenth of the bytes through the
# filesystem each build.
#
# What survives is what gets used: `.debug_line` still resolves a
# backtrace frame to `crates/…/foo.rs:214`, so panics, `#[should_panic]`
# and RUST_BACKTRACE read exactly as before. What goes is variable and
# type DWARF — stepping in a debugger and printing locals. If you are
# reaching for gdb on chapbook's own code, build that crate with
# `--config 'profile.dev.debug=2'`.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies get none at all. Nobody steps into stylo, icu or wgpu from
# here, and their debug info is the overwhelming majority of it — this is
# the half of the saving that costs nothing anyone would notice. Frames
# through a dependency still carry symbol names, only not file and line.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
# Cargo already drops debuginfo here; this drops the symbol table too,
# which is a sixth of the binary and pure weight on a device whose whole
# rootfs is measured in tens of megabytes. Panics still name the crate and
# message, only the backtrace frames go — and a backtrace off a device is
# not how any of this gets debugged anyway. Build with
# `--config profile.release.strip=false` when you do want one.
strip = "symbols"
