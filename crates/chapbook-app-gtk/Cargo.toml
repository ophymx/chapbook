[package]
name = "chapbook-app-gtk"
description = "GTK4 desktop application over the chapbook-app model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Linux only, for the same reason as chapbook-viewer-gtk: gtk4-sys probes
# for gtk4.pc through pkg-config, which a stock macOS or Windows box does
# not have. Off this target the crate is a stub `main` and no dependencies
# at all.
[target.'cfg(target_os = "linux")'.dependencies]
chapbook-app = { workspace = true, features = ["default"] }
# v4_16 for the AccessibleText interface (4.14) and its extents/offset
# geometry (4.16) — the same floor the reference viewer set, and for the
# same reason: the page in front of a screen reader.
gtk4 = { version = "0.11", features = ["v4_16"] }
futures-channel = { workspace = true }
futures-util = { workspace = true }
