[package]
name = "chapbook-jni"
description = "Android JNI binding for chapbook — a spike, not a contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# `cdylib` is what Android loads; `rlib` keeps it usable from a Rust test.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `library` is named explicitly and that is not redundant: the workspace
# dependency sets `default-features = false`, so a shell that lists only
# the formats it reads gets a session that remembers nothing — no
# position, no annotations, no settings — and nothing says so. It opens,
# renders and conforms; it just never comes back where it was left.
# `opds` stays off: it is the only feature that pulls in TLS, and the
# trust-store question is not settled here (see `android/README.md`).
chapbook-reader = { workspace = true, features = ["library", "cbz", "pdf", "opds", "svg", "mathml"] }
# Deliberately without `ureq`: a bundled TLS stack would trust
# webpki-roots and ignore Android's user CAs, enterprise roots and
# network security config. The transport comes from Kotlin, over the
# platform's own networking — which is also the C ABI's answer.
chapbook-sync = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
log = { workspace = true }
# The backend for `chapbook_core`'s log seam. `default-features = false`
# turns off `env_filter`'s `regex` feature, which is there to match a
# filter string this binding never has one of.
android_logger = { version = "0.15", default-features = false }
