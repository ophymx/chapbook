[package]
name = "chapbook-sync"
description = "Reconciles chapbook's stored positions and annotations with the services a book came from"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chapbook-core = { workspace = true }
chapbook-library = { workspace = true }
chapbook-annotations = { workspace = true, default-features = false }
chapbook-opds = { workspace = true, default-features = false, features = ["progression"] }

[dev-dependencies]
serde_json = { workspace = true }
# The end-to-end example opens a downloaded book to import it.
chapbook-reader = { workspace = true, features = ["library"] }

[features]
# Forwards the bundled desktop transport, as the other binding crates do.
default = ["ureq"]
ureq = ["chapbook-opds/ureq", "chapbook-annotations/ureq"]

# The live example opens a socket, which only the bundled transport can.
[[example]]
name = "reconcile"
required-features = ["ureq"]
