# Header generation for the C ABI. Run by `tests/header.rs`, never by a
# build: `include/chapbook.h` is checked in, and the test regenerates into a
# temp file and compares, so drift between the Rust and the header a host
# compiles against fails the gate instead of a link.

language = "C"
header = """/* chapbook — the C ABI.
 *
 * GENERATED by cbindgen from crates/chapbook-ffi. Do not edit by hand:
 * `tests/header.rs` regenerates this and fails if it differs. Change the
 * Rust, then run `UPDATE_FFI_HEADER=1 cargo test -p chapbook-ffi`.
 *
 * Contract tier — see docs/STABILITY.md. Status codes and struct layouts
 * here are permanent; the strings behind cb_last_error_message are not. */"""
include_guard = "CHAPBOOK_H"
tab_width = 4
documentation = true
documentation_style = "doxy"
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = false

[export]
prefix = ""
# Types reachable only through a function signature still need emitting.
include = ["cb_status", "cb_capability", "cb_format", "cb_rotation", "cb_theme",
           "cb_book_kind", "cb_settings_scope", "cb_position", "cb_metrics",
           "cb_settings", "cb_action", "cb_action_outcome", "cb_key",
           "cb_reading_direction", "cb_rect", "cb_text_run", "cb_word_span",
           "cb_opened", "cb_progress_label", "cb_place", "cb_saved_catalog_field",
           "cb_browse_state", "cb_browse_field", "cb_download_outcome"]

[enum]
prefix_with_name = false
rename_variants = "None"

[fn]
sort_by = "None"
